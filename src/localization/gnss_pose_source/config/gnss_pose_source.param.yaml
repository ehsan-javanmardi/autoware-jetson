/**:
  ros__parameters:
    # Minimum sensor_msgs/NavSatStatus.status the solution must report.
    #   -1 NO_FIX   0 FIX (single point, metres out)   1 SBAS   2 GBAS (RTK)
    # The nmea_navsat_driver maps GGA quality 4 (RTK fixed), 5 (RTK float) and 9 (WAAS)
    # all to 2, so this alone does not distinguish fixed from float. The real filter on
    # accuracy is max_position_stddev below.
    min_navsat_status: 2

    # Largest horizontal standard deviation [m] that may still steer the vehicle. The
    # driver derives this from the GGA quality and HDOP; with a correct epe table an RTK
    # fixed solution lands near 0.02 m and a float one a few tenths.
    # 1.0 m is deliberately generous for bring-up. Tighten it to ~0.1 m before relying on
    # this for lane keeping, since nothing else is correcting the position.
    max_position_stddev: 1.0

    # How old the supporting NavSatFix may be [s]. Guards against the pose continuing to
    # arrive after the receiver has stopped reporting a solution.
    max_fix_age_sec: 0.5

    # Require a dual-antenna heading. Without one, gnss_poser derives yaw from the
    # direction of travel, which is meaningless at a standstill; as the only pose source
    # that would let the EKF swing the heading around while parked.
    require_ins_orientation: true
    max_orientation_age_sec: 0.5
