/**:
  ros__parameters:
    # The RMP has no mirrors. The crop box still has to exist because the pointcloud
    # preprocessor loads it unconditionally, so it is given a zero-sized box that
    # removes nothing.
    min_longitudinal_offset: 0.0
    max_longitudinal_offset: 0.0
    min_lateral_offset: 0.0
    max_lateral_offset: 0.0
    min_height_offset: 0.0
    max_height_offset: 0.0
