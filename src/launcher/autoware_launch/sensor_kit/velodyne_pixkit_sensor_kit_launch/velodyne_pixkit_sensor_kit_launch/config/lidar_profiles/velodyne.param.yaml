# Lidar profile: the stock Pixkit four VLP-16s (192.168.1.201-204), no Ouster.
#
# UNVERIFIED. These are the three input topics the Pixkit configuration shipped with, kept so
# the profile exists, but no VLP-16 has been connected to this vehicle to confirm the topic
# names the drivers actually produce. Check with `ros2 topic list | grep sensing/lidar` before
# trusting it, and note that the top lidar is expected here after outlier filtering while the
# other two are taken before synchronization.
/**:
  ros__parameters:
    debug_mode: false
    rosbag_length: 10.0
    maximum_queue_size: 5
    timeout_sec: 0.2
    is_motion_compensated: true
    publish_synchronized_pointcloud: true
    keep_input_frame_in_synchronized_pointcloud: true
    publish_previous_but_late_pointcloud: false
    synchronized_pointcloud_postfix: pointcloud
    input_twist_topic_type: twist
    input_topics: [
                    "/sensing/lidar/right/pointcloud_before_sync",
                    "/sensing/lidar/top/outlier_filtered/pointcloud",
                    "/sensing/lidar/left/pointcloud_before_sync",
                ]
    output_frame: base_link
    matching_strategy:
      type: advanced
      lidar_timestamp_offsets: [0.0, 0.0, 0.0]
      lidar_timestamp_noise_window: [0.01, 0.01, 0.01]
