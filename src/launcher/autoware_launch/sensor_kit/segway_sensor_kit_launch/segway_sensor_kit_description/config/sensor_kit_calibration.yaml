  gnss_link:
    # THIS is the frame gnss_poser uses (gnss_frame: gnss_link), not base_link2gnss in
    # sensors_calibration.yaml, which builds an unused "gnss" frame.
    #
    # The u-blox ZED-F9R antenna is over the centre of the rear axle, which is exactly
    # where base_link is, so x and y are zero. Relative to sensor_kit_base_link at
    # chassis top, z 0 puts the antenna at 0.274 m above the ground; raise it if the
    # antenna is on a riser.
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
