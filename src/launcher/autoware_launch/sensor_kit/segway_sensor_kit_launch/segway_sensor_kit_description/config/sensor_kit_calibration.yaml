  livox_frame:
    # Livox HAP, mounted at the front of the chassis, laterally centred.
    #
    # x is DERIVED, not measured: wheelbase 0.456 + front overhang 0.108 = 0.564 m
    # ahead of base_link, where the overhang is (length 0.672 - wheelbase 0.456) / 2 and
    # assumes the axles sit symmetrically in the body. Relative to sensor_kit_base_link,
    # which is already at the rear axle, that is the full 0.564.
    #
    # z is 0: the frame sits at chassis top, where the HAP is bolted. If the sensor is on
    # a riser, or its optical centre is above its base, add that here.
    #
    # The HAP's IMU shares this frame - the driver publishes /livox/imu with frame_id
    # livox_frame - so imu_corrector needs no separate extrinsic.
    x: 0.564
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
