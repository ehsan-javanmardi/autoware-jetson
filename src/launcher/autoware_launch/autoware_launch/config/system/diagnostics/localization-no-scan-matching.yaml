# Localization checks for a run with no map matcher (pose_source:=gnss).
#
# Identical to localization.yaml except that /autoware/localization/scan_matching_status
# is absent. That unit reads "ndt_scan_matcher: scan_matching_status", which nothing
# publishes when NDT is not started, so it stays STALE for ever and takes the whole
# /autoware/localization branch to ERROR with it - autonomous mode is then never offered
# and nothing says why.
#
# Written out in full rather than produced with an "edits: [{type: remove}]" overlay,
# which is how autoware-main-e2e.yaml does the same job: that mechanism segfaults the
# aggregator in this version. See the note in autoware-main-no-scan-matching.yaml.
units:
  - path: /autoware/localization
    type: and
    list:
      - type: link
        link: /autoware/localization/state
      - type: and
        list:
          - { type: link, link: /autoware/localization/topic_rate_check/transform }
          - { type: link, link: /autoware/localization/topic_rate_check/pose_twist_fusion }
          - { type: link, link: /autoware/localization/accuracy }
          - { type: link, link: /autoware/localization/sensor_fusion_status }

  - path: /autoware/localization/state
    type: diag
    node: /adapi/node/localization
    name: state

  - path: /autoware/localization/topic_rate_check/transform
    type: diag
    node: topic_state_monitor_transform_map_to_base_link
    name: localization_topic_status

  - path: /autoware/localization/topic_rate_check/pose_twist_fusion
    type: diag
    node: topic_state_monitor_pose_twist_fusion_filter_pose
    name: localization_topic_status

  - path: /autoware/localization/accuracy
    type: diag
    node: localization_error_monitor
    name: ellipse_error_status

  - path: /autoware/localization/sensor_fusion_status
    type: diag
    node: localization
    name: ekf_localizer
