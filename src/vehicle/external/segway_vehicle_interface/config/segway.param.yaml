/**:
  ros__parameters:
    serial_port: ttyUSB0

    # Empty uses SEGWAY_SDK_LIB, then the built-in default. The vendor library is not
    # redistributable, so it is not vendored into this repository.
    library_path: ""

    # Motion is opt-in. False does not merely decline to send commands: the SDK write
    # paths are never bound, so the node has no callable route to motion.
    allow_control: false

    # VIRTUAL. The RMP has no steered axle; this converts Autoware's bicycle-model
    # steering angle into a yaw rate. It must match wheel_base in the vehicle
    # description, or the controller and the chassis disagree about what a command means.
    wheel_base: 0.55

    max_linear_mps: 1.0
    max_angular_radps: 1.0

    # A differential base holds its last velocity indefinitely, so a planner that stops
    # publishing leaves it driving. Beyond this age the command is zeroed.
    command_timeout_s: 0.5

    status_rate_hz: 50.0
