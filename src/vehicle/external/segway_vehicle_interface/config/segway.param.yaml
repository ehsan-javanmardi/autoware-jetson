/**:
  ros__parameters:
    # /dev/segway is a udev symlink (99-segway-serial.rules) rather than ttyUSBn.
    # The converter re-enumerates on every replug and does not come back on the same
    # number: it was observed disconnecting from ttyUSB0 and returning as ttyUSB1, which
    # presents as a chassis that has stopped replying rather than as a missing port.
    serial_port: segway

    # Empty uses SEGWAY_SDK_LIB, then the built-in default. The vendor library is not
    # redistributable, so it is not vendored into this repository.
    library_path: ""

    # Motion is opt-in. False does not merely decline to send commands: the SDK write
    # paths are never bound, so the node has no callable route to motion.
    allow_control: false

    # VIRTUAL. The RMP has no steered axle; this converts Autoware's bicycle-model
    # steering angle into a yaw rate. It MUST match wheel_base in segway_description's
    # vehicle_info.param.yaml, or the controller and the chassis disagree about what a
    # command means. 0.456 m is the manual's wheelbase (Table 1, System parameters).
    wheel_base: 0.456

    # The chassis itself can do 3.56 m/s and 2 rad/s (manual). These are the far lower
    # limits this interface will command, and the web UI adjusts max_linear_mps at
    # runtime. Raise deliberately: at 3.56 m/s a 28 kg base has real momentum, and the
    # manual quotes ~1 m of braking distance from that speed under full load.
    max_linear_mps: 1.0
    max_angular_radps: 1.5

    # A differential base holds its last velocity indefinitely, so a planner that stops
    # publishing leaves it driving. Beyond this age the command is zeroed.
    command_timeout_s: 0.5

    status_rate_hz: 50.0
